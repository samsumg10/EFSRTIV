<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Empleados · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="page-header">
      <h2>Gestión de Empleados</h2>
      <button type="button" class="btn btn-primary" id="btn-new">+ Nuevo Empleado</button>
    </div>

    <div class="filtro-bar">
      <input type="text" id="search" class="input-buscar" placeholder="Buscar por nombre o correo...">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Instalaciones</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="employee-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="employee-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Empleado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre *</label>
              <input name="name" maxlength="100" required>
            </div>
            <div class="form-group">
              <label>Correo (usuario) *</label>
              <input name="email" type="email" maxlength="140" required>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input name="phone" maxlength="20">
            </div>
            <div class="form-group">
              <label>Rol *</label>
              <select name="roleId" data-type="number" id="role-select"></select>
            </div>
          </div>
          <div class="form-grid mt-3">
            <div class="form-group">
              <label>Contraseña <span class="password-required">*</span></label>
              <input name="password" type="password" autocomplete="new-password">
              <span class="hint" id="password-hint">Mínimo 8 caracteres.</span>
            </div>
            <div class="form-group">
              <label>Confirmar contraseña <span class="password-required">*</span></label>
              <input name="passwordConfirmation" type="password" autocomplete="new-password">
            </div>
          </div>
          <div class="form-group mt-3" id="facilities-group">
            <label>Instalaciones asignadas</label>
            <div class="check-list" id="facility-checks" data-error-for="facilityIds"></div>
            <span class="hint">Un empleado solo ve y gestiona las instalaciones marcadas.</span>
          </div>
          <p class="hint mt-3" id="admin-hint" hidden>Un administrador de empresa tiene acceso a todas las instalaciones.</p>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/company-employees.js"></script>
</body>
</html>
