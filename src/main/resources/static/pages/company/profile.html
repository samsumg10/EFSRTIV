<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Perfil · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="page-header">
      <div>
        <h2>Perfil de la Empresa</h2>
        <div class="subtitle" id="uuid-line"></div>
      </div>
    </div>

    <div class="loading" id="loading">Cargando...</div>

    <form id="profile-form" novalidate hidden>
      <div class="alert alert-error form-error" hidden></div>

      <div class="card">
        <h3>🏢 Datos de la empresa</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre *</label>
            <input name="name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label>Correo *</label>
            <input name="email" type="email" maxlength="140" required>
          </div>
          <div class="form-group">
            <label>Teléfono *</label>
            <input name="phone" maxlength="20" required>
          </div>
        </div>
        <div class="form-grid mt-3">
          <div class="form-group">
            <label>Dirección</label>
            <input name="address" maxlength="255">
          </div>
          <div class="form-group">
            <label>Sitio web</label>
            <input name="url" maxlength="255" placeholder="https://...">
          </div>
        </div>
      </div>

      <div class="card">
        <h3>👤 Mi cuenta</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre *</label>
            <input name="accountName" maxlength="100" required>
          </div>
          <div class="form-group">
            <label>Correo (usuario) *</label>
            <input name="accountEmail" type="email" maxlength="140" required>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input name="accountPhone" maxlength="20">
          </div>
          <div class="form-group">
            <label>Rol</label>
            <input name="accountRoleName" readonly>
          </div>
        </div>
        <div class="form-grid mt-3">
          <div class="form-group">
            <label>Nueva contraseña</label>
            <input name="accountPassword" type="password" autocomplete="new-password">
            <span class="hint">Déjala vacía para no cambiarla.</span>
          </div>
          <div class="form-group">
            <label>Confirmar contraseña</label>
            <input name="accountPasswordConfirmation" type="password" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/company-profile.js"></script>
</body>
</html>
