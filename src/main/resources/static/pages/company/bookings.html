<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Reservas · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page page-wide" hidden>
    <div class="breadcrumbs" id="crumbs"></div>
    <div class="page-header">
      <div>
        <h2 id="title">Reservas</h2>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="header-actions">
        <a class="btn btn-secondary" id="btn-closeddays" href="#">🚫 Días cerrados</a>
        <a class="btn btn-secondary" id="btn-list" href="#">📋 Lista de reservas</a>
      </div>
    </div>

    <div class="alert alert-info">Haz clic en un día disponible para registrar una reserva, o en una reserva para ver su detalle.</div>

    <div class="calendar-card">
      <label class="d-inline-flex align-items-center gap-2 mb-2 muted">
        <input type="checkbox" id="show-cancelled"> Mostrar reservas canceladas y expiradas
      </label>
      <div id="calendar"></div>
      <div id="legend"></div>
    </div>
  </div>

  <div class="modal fade" id="booking-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="booking-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nueva reserva</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="date">
          <div class="mb-2"><div class="selected-date mb-1" id="selected-date" data-error-for="date"></div></div>

          <p class="form-section-title">👤 Cliente</p>
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre *</label>
              <input name="name" maxlength="100" required>
            </div>
            <div class="form-group">
              <label>Correo *</label>
              <input name="email" type="email" maxlength="150" required>
            </div>
            <div class="form-group">
              <label>Teléfono *</label>
              <input name="phone" maxlength="20" required>
            </div>
            <div class="form-group">
              <label>Personas *</label>
              <input name="numberPersons" type="number" min="1" step="1" value="1" required>
              <span class="hint" id="capacity-hint"></span>
            </div>
          </div>

          <p class="form-section-title">🍖 Productos adicionales</p>
          <div><div id="product-rows" data-error-for="products"></div></div>

          <div class="mt-3">
            <div class="resumen-item"><span>Reserva de la ubicación</span><strong id="sum-location"></strong></div>
            <div class="resumen-item"><span>Productos</span><strong id="sum-products"></strong></div>
            <div class="resumen-item total"><span>Total</span><span id="sum-total"></span></div>
            <p class="hint mb-0">Las reservas registradas desde el panel quedan como <strong>pagadas</strong>.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Registrar reserva</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/booking-detail.js"></script>
  <script src="/js/pages/company-bookings.js"></script>
</body>
</html>
