<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Lista de reservas · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page page-wide" hidden>
    <div class="breadcrumbs" id="crumbs"></div>
    <div class="page-header">
      <h2 id="title">Reservas</h2>
      <div class="form-group" style="min-width: 260px">
        <select id="facility-select" aria-label="Instalación"></select>
      </div>
    </div>

    <form class="card" id="filter-form" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label>Fecha de reserva desde</label>
          <input type="date" name="resStart">
        </div>
        <div class="form-group">
          <label>Fecha de reserva hasta</label>
          <input type="date" name="resEnd">
        </div>
        <div class="form-group">
          <label>Registrada desde</label>
          <input type="date" name="regStart">
        </div>
        <div class="form-group">
          <label>Registrada hasta</label>
          <input type="date" name="regEnd">
        </div>
        <div class="form-group">
          <label>Ubicación</label>
          <select name="locationId" id="location-select"><option value="">Todas</option></select>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select name="status">
            <option value="">Todos</option>
            <option value="1">Pendiente</option>
            <option value="2">Pagado</option>
            <option value="3">Cancelado</option>
            <option value="4">Expirado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Código de reserva</label>
          <input name="uuid" placeholder="UUID completo">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">🔍 Buscar</button>
        <button type="button" class="btn btn-secondary" id="btn-clear">Limpiar</button>
      </div>
    </form>

    <div class="kpi-grid">
      <div class="kpi-card kpi-total">
        <div class="kpi-icon">📋</div>
        <div class="kpi-info"><span class="kpi-valor" id="kpi-total">—</span><span class="kpi-label">Reservas</span></div>
      </div>
      <div class="kpi-card kpi-monto">
        <div class="kpi-icon">💰</div>
        <div class="kpi-info"><span class="kpi-valor" id="kpi-amount">—</span><span class="kpi-label">Monto total</span></div>
      </div>
      <div class="kpi-card kpi-pagado">
        <div class="kpi-icon">✅</div>
        <div class="kpi-info"><span class="kpi-valor" id="kpi-paid">—</span><span class="kpi-label" id="kpi-paid-label">Pagadas</span></div>
      </div>
      <div class="kpi-card kpi-pendiente">
        <div class="kpi-icon">⏳</div>
        <div class="kpi-info"><span class="kpi-valor" id="kpi-pending">—</span><span class="kpi-label" id="kpi-pending-label">Pendientes de pago</span></div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Cliente</th>
            <th>Ubicación</th>
            <th>Fecha</th>
            <th class="num">Personas</th>
            <th class="num">Total</th>
            <th>Estado</th>
            <th>Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="d-flex align-items-center justify-content-between mt-3 gap-2 flex-wrap">
      <span class="muted" id="page-info"></span>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-sm btn-secondary" id="btn-prev">← Anterior</button>
        <button type="button" class="btn btn-sm btn-secondary" id="btn-next">Siguiente →</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/booking-detail.js"></script>
  <script src="/js/pages/company-booking-list.js"></script>
</body>
</html>
