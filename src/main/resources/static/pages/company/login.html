<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Ingreso empresa · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body data-area="company">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">🔥</span>
        <h1>BBQ Reservas</h1>
        <p>Panel de empresa</p>
      </div>
      <form id="login-form" novalidate>
        <div class="alert alert-error form-error" hidden></div>
        <div class="form-group">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" placeholder="usuario@empresa.com" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
      </form>
      <p class="login-switch">¿Administras la plataforma? <a href="/admin/login">Ingresa aquí</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
