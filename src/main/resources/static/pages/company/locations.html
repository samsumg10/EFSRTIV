<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Ubicaciones · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page page-wide" hidden>
    <div class="breadcrumbs" id="crumbs"></div>
    <div class="page-header">
      <div>
        <h2 id="title">Ubicaciones</h2>
        <div class="subtitle">Zonas reservables de la instalación (parrillas, quinchos, carpas...).</div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-new">+ Nueva Ubicación</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Ubicación</th>
            <th>Capacidad por día</th>
            <th class="num">Precio por reserva</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="location-modal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="location-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nueva Ubicación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">
          <div class="form-group mb-3">
            <label>Nombre *</label>
            <input name="name" maxlength="100" required>
          </div>
          <div class="form-grid mb-3">
            <div class="form-group">
              <label>Capacidad (personas por día)</label>
              <input name="maxPerson" type="number" min="1" max="99999" step="1">
              <span class="hint">Vacío = exclusiva: una sola reserva por día.</span>
            </div>
            <div class="form-group">
              <label>Precio por reserva (S/) *</label>
              <input name="price" type="number" min="0" step="0.01" required>
            </div>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea name="description" maxlength="2000" placeholder="Se muestra a los clientes en el portal."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/company-locations.js"></script>
</body>
</html>
