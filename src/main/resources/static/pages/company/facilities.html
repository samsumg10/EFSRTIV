<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Instalaciones · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="page-header">
      <h2>Instalaciones</h2>
      <button type="button" class="btn btn-primary" id="btn-new" hidden>+ Nueva Instalación</button>
    </div>

    <div class="filtro-bar">
      <input type="text" id="search" class="input-buscar" placeholder="Buscar por nombre, correo o dirección...">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Instalación</th>
            <th>Contacto</th>
            <th>Dirección</th>
            <th class="num">Ubicaciones</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="facility-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="facility-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nueva Instalación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre *</label>
              <input name="name" maxlength="100" required>
            </div>
            <div class="form-group">
              <label>Correo *</label>
              <input name="email" type="email" maxlength="150" required>
            </div>
            <div class="form-group">
              <label>Teléfono *</label>
              <input name="phone" maxlength="20" required>
            </div>
          </div>
          <div class="form-group mt-3">
            <label>Dirección</label>
            <input name="address" maxlength="255">
          </div>
          <div class="form-group mt-3">
            <label>Descripción</label>
            <textarea name="description" maxlength="2000" placeholder="Se muestra a los clientes en el portal."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/company-facilities.js"></script>
</body>
</html>
