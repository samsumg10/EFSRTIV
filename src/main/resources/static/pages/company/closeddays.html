<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Días cerrados · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="breadcrumbs" id="crumbs"></div>
    <div class="page-header">
      <div>
        <h2 id="title">Días cerrados</h2>
        <div class="subtitle">En estos días la ubicación no acepta reservas (mantenimiento, feriados, eventos privados...).</div>
      </div>
      <div class="header-actions">
        <a class="btn btn-secondary" id="btn-calendar" href="#">📅 Ver calendario</a>
        <button type="button" class="btn btn-primary" id="btn-new">+ Nuevo día cerrado</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Desde</th>
            <th>Hasta</th>
            <th class="num">Días</th>
            <th>Motivo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="closedday-modal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="closedday-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nuevo día cerrado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">
          <div class="form-grid mb-3">
            <div class="form-group">
              <label>Desde *</label>
              <input name="startDate" type="date" required>
            </div>
            <div class="form-group">
              <label>Hasta</label>
              <input name="endDate" type="date">
              <span class="hint">Vacío = solo un día.</span>
            </div>
          </div>
          <div class="form-group">
            <label>Motivo</label>
            <textarea name="reason" maxlength="1000" placeholder="Ej: Mantenimiento de parrillas"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/company-closeddays.js"></script>
</body>
</html>
