<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Reservar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <header class="portal-topbar">
    <span style="font-size:1.5rem">🔥</span>
    <div>
      <div class="brand" id="brand">BBQ Reservas</div>
      <div class="brand-sub" id="brand-sub"></div>
    </div>
  </header>

  <main class="portal-content">
    <div id="flash"></div>
    <div id="content">
      <div class="breadcrumbs" id="crumbs"></div>
      <div class="page-header">
        <div>
          <h2 id="title">Reservar</h2>
          <div class="subtitle" id="subtitle"></div>
        </div>
      </div>

      <div class="two-cols">
        <div class="calendar-card">
          <h3 class="h6 mb-3" style="color:#1a237e">1. Elige el día</h3>
          <div id="calendar"></div>
          <div id="legend"></div>
        </div>

        <form class="card mb-0" id="booking-form" novalidate>
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="date">
          <h3>2. Completa tu reserva</h3>
          <div class="mb-3"><div class="selected-date mb-1" id="selected-date" data-error-for="date">Selecciona un día en el calendario.</div></div>

          <fieldset id="form-fields" disabled>
            <div class="form-group mb-3">
              <label>Número de personas *</label>
              <input name="numberPersons" type="number" min="1" step="1" value="1" required>
              <span class="hint" id="capacity-hint"></span>
            </div>

            <p class="form-section-title">🍖 Productos adicionales</p>
            <div class="mb-2"><div id="product-rows" data-error-for="products"></div></div>

            <p class="form-section-title">👤 Tus datos</p>
            <div class="form-group mb-3">
              <label>Nombre completo *</label>
              <input name="name" maxlength="100" autocomplete="name" required>
            </div>
            <div class="form-group mb-3">
              <label>Correo *</label>
              <input name="email" type="email" maxlength="150" autocomplete="email" required>
            </div>
            <div class="form-group mb-3">
              <label>Teléfono *</label>
              <input name="phone" maxlength="20" autocomplete="tel" required>
            </div>

            <div class="resumen-item"><span>Reserva</span><strong id="sum-location"></strong></div>
            <div class="resumen-item"><span>Productos</span><strong id="sum-products"></strong></div>
            <div class="resumen-item total"><span>Total</span><span id="sum-total"></span></div>

            <button type="submit" class="btn btn-primary btn-block mt-3">Continuar →</button>
          </fieldset>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/portal.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/pages/portal-location.js"></script>
</body>
</html>
