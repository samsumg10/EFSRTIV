<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Empresas · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="page-header">
      <h2>Gestión de Empresas</h2>
      <button type="button" class="btn btn-primary" id="btn-new">+ Nueva Empresa</button>
    </div>

    <div class="filtro-bar">
      <input type="text" id="search" class="input-buscar" placeholder="Buscar por nombre, correo o representante...">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Representante</th>
            <th>Estado</th>
            <th>Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="company-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="company-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nueva Empresa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">

          <p class="form-section-title">🏢 Empresa</p>
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre *</label>
              <input name="name" maxlength="100" required>
            </div>
            <div class="form-group">
              <label>Correo *</label>
              <input name="email" type="email" maxlength="140" required>
            </div>
            <div class="form-group">
              <label>Teléfono *</label>
              <input name="phone" maxlength="20" placeholder="01-555-0000" required>
            </div>
            <div class="form-group">
              <label>Estado *</label>
              <select name="status" data-type="number">
                <option value="1">Activa</option>
                <option value="0">Inactiva</option>
              </select>
            </div>
          </div>
          <div class="form-grid mt-3">
            <div class="form-group">
              <label>Dirección</label>
              <input name="address" maxlength="255">
            </div>
            <div class="form-group">
              <label>Sitio web</label>
              <input name="url" maxlength="255" placeholder="https://...">
            </div>
          </div>

          <p class="form-section-title">👤 Representante (usuario administrador de la empresa)</p>
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre *</label>
              <input name="representativeName" maxlength="100" required>
            </div>
            <div class="form-group">
              <label>Correo (usuario) *</label>
              <input name="representativeEmail" type="email" maxlength="140" required>
            </div>
            <div class="form-group">
              <label>Teléfono</label>
              <input name="representativePhone" maxlength="20">
            </div>
            <div class="form-group">
              <label>Contraseña <span id="password-required">*</span></label>
              <input name="representativePassword" type="password" autocomplete="new-password">
              <span class="hint" id="password-hint">Mínimo 8 caracteres.</span>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/admin-companies.js"></script>
</body>
</html>
