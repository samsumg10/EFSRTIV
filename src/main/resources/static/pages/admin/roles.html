<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Roles · BBQ Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <div id="page" class="page" hidden>
    <div class="page-header">
      <div>
        <h2>Gestión de Roles</h2>
        <div class="subtitle">Los roles se asignan a los empleados de las empresas.</div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-new">+ Nuevo Rol</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Qué puede hacer</th>
            <th class="num">Empleados</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="role-modal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="role-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Rol</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-error form-error" hidden></div>
          <input type="hidden" name="id">
          <div class="form-group mb-3">
            <label>Nombre *</label>
            <input name="name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label>Tipo *</label>
            <select name="type" data-type="number">
              <option value="1">Administrador de empresa</option>
              <option value="2">Empleado</option>
            </select>
            <span class="hint">Administrador: gestiona todo en su empresa. Empleado: solo las instalaciones que se le asignen.</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/admin-roles.js"></script>
</body>
</html>
